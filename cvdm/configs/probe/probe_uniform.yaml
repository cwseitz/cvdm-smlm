  #   "100": "/path/to/mu_weights_density_100.h5"
  snr_expansion_n: 1
  zmd: false
  diff_inp: false

eval:
  generation_timesteps: 200
  image_freq: 100
  checkpoint_freq: 1000
  log_freq: 100
  val_freq: 200
  val_len: 10

sim:
  generator: "Uniform2D"
  size: 64
  sigma: 1.0
  texp: 1.0
  N0_min: 500.0
  N0_max: 1000.0
  eta: 1.0
  gain: 1.0
  B0: 0.0
  offset: 100.0
  var: 5.0
  halo_alpha: 0.0
  halo_sigma: 4.0
  grf_alpha: 0.0
  grf_sigma: 10.0
  grf_seed: null
  label_upsample: 4
  label_sigma: 2.0
  label_scale: 1.0
  label_centering: false
  input_upsample: 4

probe:
  densities: [100, 200, 500]
  n_images: 5
  n_iters: 5
  show_tqdm: true
  save_cache: true
  use_probe_cache: false
  subtract_offset: true
  input_centering: "none"  # "none" or "zscore"
  cache_dir: "probe_cache"
  detect_on: "mean"  # "mean" or "single"
  inset_lr_size: 15
  inset_hr_size: 60
  fig3_inset: [50, 50]
  fig3_inset_in_lr: true
  fig3_samples: [0, 1, 4, 5]
  inset_contrast_low: 1.0
  inset_contrast_high: 99.0
  std_overlay_percentile: 80.0
  contrast_low: 1.0
  contrast_high: 99.0

metrics:
  tol: 5.0
  pixel_size_nm: 25.0
  error_bins: [500, 600, 700, 800, 900]

detection:
  log_threshold: 5.0
  fit_enabled: false
