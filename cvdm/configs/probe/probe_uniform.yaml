output_dir: "/mnt/seitzcx/exps/exp_CVDM/probes/csbt2/cvdm_uniform-nx-sigma1-multi"

model:
  noise_model_type: "unet"
  alpha: 0.001
  #load_weights: "/mnt/seitzcx/exps/exp_CVDM/models/csbt2/cvdm_uniform-n100-sigma1/weights/model_12000_963d1078-9ccc-4c47-b44a-c073b69ce5d4.h5"
  load_mu_weights: null
  # Optional per-density weight overrides (keys must match `probe.densities` as strings)
  load_weights_map:
    "100": "/mnt/seitzcx/exps/exp_CVDM/models/csbt2/cvdm_uniform-n100-sigma1/weights/model_12000_963d1078-9ccc-4c47-b44a-c073b69ce5d4.h5"
    "200": "/mnt/seitzcx/exps/exp_CVDM/models/csbt2/cvdm_uniform-n200-sigma1/weights/model_12000_e496ca0a-81e5-4bc9-90c1-52c902b85986.h5"
    "500": "/mnt/seitzcx/exps/exp_CVDM/models/csbt2/cvdm_uniform-n500-sigma1/weights/model_12000_ddf7cf0f-0611-4b52-8f8f-8c024f444509.h5"
  # load_mu_weights_map:
  #   "100": "/path/to/mu_weights_density_100.h5"
  snr_expansion_n: 1
  zmd: false
  diff_inp: false

eval:
  generation_timesteps: 200
  image_freq: 100
  checkpoint_freq: 1000
  log_freq: 100
  val_freq: 200
  val_len: 10

sim:
  generator: "Uniform2D"
  size: 64
  sigma: 1.0
  texp: 1.0
  N0_min: 100.0
  N0_max: 1000.0
  eta: 1.0
  gain: 1.0
  B0: 0.0
  offset: 100.0
  var: 5.0
  halo_alpha: 0.0
  #halo_sigma: 4.0
  grf_alpha: 0.0
  #grf_sigma: 10.0
  grf_seed: null
  label_upsample: 4
  label_sigma: 2.0
  label_scale: 100.0
  label_centering: true
  input_upsample: 4

probe:
  densities: [100,200,500]
  n_images: 100
  n_iters: 10
  show_tqdm: true
  save_cache: true
  subtract_offset: false
  input_centering: "zscore"  # "none" or "zscore"
  cache_dir: "probe_cache"

metrics:
  tol: 5.0
  pixel_size_nm: 25.0
  error_bins: [500, 600, 700, 800, 900]

detection:
  log_threshold: 5.0
  fit_enabled: false
