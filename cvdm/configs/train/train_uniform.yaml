task: "SMLM"

model:
  noise_model_type: "unet"
  alpha: 0.001
  load_weights: null
  load_mu_weights: null
  snr_expansion_n: 1
  zmd: false
  diff_inp: false

training:
  lr: 0.0001
  epochs: 150

# Number of batches drawn per epoch from the on-the-fly simulator
steps_per_epoch: 200
# Number of validation batches used for each val step
val_steps: 10

eval:
  output_path: "/mnt/seitzcx/exps/exp_CVDM/models/csbt"
  generation_timesteps: 200
  checkpoint_freq: 1000
  log_freq: 100
  image_freq: 100
  val_freq: 200
  val_len: 10
  n_iters: 1

output_subdir: "cvdm_uniform-n100-sigma1"
sim_preview_count: 100
sim_preview_path: null

neptune:
  name: "CVDM"
  project: "cwseitz/train"

data:
  batch_size: 2
  im_size: 64

sim:
  generator: "Uniform2D"
  size: null
  nspots_min: 100
  nspots_max: 101
  sigma: 1.0
  texp: 1.0
  N0_min: 500.0
  N0_max: 1000.0
  eta: 1.0
  gain: 1.0
  B0_min: 0.0
  B0_max: 0.0
  offset: 100.0
  var: 5.0
  halo_alpha: 0.0
  #halo_sigma: 4.0
  grf_alpha: 0.0
  #grf_sigma_min: 5.0
  #grf_sigma_max: 20.0
  grf_seed: null
  label_type: "kde"  # "kde", "spikes", or "mu_s"
  label_upsample: 4
  label_sigma: 2.0
  input_upsample: 4
  input_centering: "zscore"  # "none" or "zscore"
  label_scale: 100.0
  label_centering: true

val:
  enabled: false
