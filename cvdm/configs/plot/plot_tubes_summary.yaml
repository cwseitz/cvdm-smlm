paths:
  hd_dir: "/mnt/seitzcx/exps/exp_CVDM/data/cvdm_sz64_n500_high_d"
  ls_dir: "/mnt/seitzcx/exps/exp_CVDM/data/cvdm_sz64_n15k_long_sum5"
  hd_100it_dir: "/mnt/seitzcx/exps/exp_CVDM/results/csbt/cvdm_sz64_n500_high_d-100it"
  ls_100it_dir: "/mnt/seitzcx/exps/exp_CVDM/results/csbt/cvdm_sz64_n15k_long_sum5-100it"
  hd_results_dir: "/mnt/seitzcx/exps/exp_CVDM/results/cvdm_sz64_n500_high_d"
  ls_results_dir: "/mnt/seitzcx/exps/exp_CVDM/results/cvdm_sz64_n15k_long_sum5"
  output_dir: "/mnt/seitzcx/exps/exp_CVDM/results/csbt/figure4_tubes"
figure_4b:
  hd_idx: 0
  ls_idx: 0
  ls_sum_idx: 0
  rolling_ball_radius: 5.0
  trim_border_px: 5
  lr_inset_size: 15
  hr_inset_size: 60
  lr_inset_coords:
    - [10, 3]
    - [2, 4]
  hr_inset_coords:
    - [40, 12]
    - [8, 16]
  output_name: "figure-4b.png"

figure_4cd:
  overlay_dot_size: 0.1
  overlay_alpha: 0.1
  sum_100it_display_threshold: 0.2  # set numeric value to zero all pixels below threshold in 100it standalone images
  detection:
    log_threshold: 0.2
    median_filter_radius_px: 1  # set to 1 to median-filter before LoG detection
    min_sigma: 0.75
    max_sigma: 1.5
    kde_sigma: 1.0
    max_spots_per_frame: 0
    movie_stride: 1
    regenerate_cvdm_render: false
    napari_preview: false
    napari_preview_only: false
    napari_preview_dataset: "both"  # one of: hd, ls, both
  ls_cvdm_roll: [0, 1]
  hd_cvdm_roll_axis0: 5
  hd_cvdm_roll_axis1: 4
  ls_thunder_vmax: 40.0
  ls_thunder_multi_vmax: 30.0
  output_panel_ls: "figure-4c-1.png"
  output_panel_hd: "figure-4c-2.png"
  output_line_name: "figure-4c.png"
  output_crop_name: "figure-4d.png"
  output_ls_100it_scatter: "figure-100it-ls-scatter.png"
  output_hd_100it_scatter: "figure-100it-hd-scatter.png"
  pixel_size_nm: 25.0
  ls_profile_row: 120
  ls_profile_start: 50
  ls_profile_stop: 80
  hd_profile_row: 182
  hd_profile_start: 83
  hd_profile_stop: 113
  profile_offset: 40
  hd_crop_row_start: 162
  hd_crop_row_stop: 212
  hd_crop_col_start: 73
  hd_crop_col_stop: 123

figure_4frc:
  cvdm_results_dir: "/mnt/seitzcx/exps/exp_CVDM/results/cvdm_sz64_n500_high_d"
  thunder_spots_csv: "/mnt/seitzcx/exps/exp_CVDM/data/cvdm_sz64_n500_high_d/thunderstorm/spots.csv"
  pixel_size_nm: 80.0
  upsample_factor: 4
  image_size_lr_px: 64
  frc_bin_size_nm: 20.0
  count_match_total_localizations: 20000  # sample this many per method before split-FRC
  split_mode: "random"   # one of: random, odd_even
  split_seed: 0
  thunder_frame_column: "frame"  # set null if not available
  # optional; defaults to figure_4cd.detection if omitted
  # detection:
  #   log_threshold: 0.2
  #   min_sigma: 0.75
  #   max_sigma: 1.5
  #   max_spots_per_frame: 0
  #   median_filter_radius_px: 1
  #   fit_enabled: true
  frc_threshold: 0.142857142857
  output_frc_plot: "figure-4e-frc.png"
  output_frc_csv: "figure-4e-frc.csv"
  output_frc_summary: "figure-4e-frc-summary.yaml"
  output_frc_inputs_plot: "figure-4e-frc-inputs.png"
  output_frc_cvdm_split_a_tif: "figure-4e-frc-cvdm-split-a.tif"
  output_frc_cvdm_split_b_tif: "figure-4e-frc-cvdm-split-b.tif"
  output_frc_thunder_split_a_tif: "figure-4e-frc-thunderstorm-split-a.tif"
  output_frc_thunder_split_b_tif: "figure-4e-frc-thunderstorm-split-b.tif"
