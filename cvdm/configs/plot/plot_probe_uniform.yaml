mode: "probe"

plot:
  # Figures are written under this directory.
  probe_output_dir: "/mnt/seitzcx/exps/exp_CVDM/probes/csbt/uniform-corr-n100-sigma1"

  # Cache source can be relative to probe_output_dir (default) or absolute.
  cache_dir: "probe_cache"
  generator: "Uniform2D"
  size: 64
  input_upsample: 4
  label_upsample: 4
  label_sigma: 2.0
  label_scale: 1.0
  label_centering: false
  sigma: 1.0

  # Optional: override inferred densities/sample count from cache folders.
  # densities: [100, 200, 500]
  # n_images: 5

  contrast_low: 1.0
  contrast_high: 99.0
  inset_contrast_low: 1.0
  inset_contrast_high: 99.0
  std_overlay_percentile: 80.0
  map_cluster_radius_lr: 2.0
  map_patch_size_lr: 9

  pixel_size_nm: 25.0
  tol: 5.0
  error_bins: [500, 600, 700, 800, 900]

  log_threshold: 0.2
  min_sigma: 0.75
  max_sigma: 1.5
  fit_enabled: true

  # Any existing probe targets supported by mains/probe.py are valid.
  probes:
    - 2a
    - 3a
    - 3b
    - 3c
    - 2bc
    - 2de
    - corr
    - detect_overlay
    - detect_by_density
    - 3b_map
    - uncertainty_corr
    - sample_stack
